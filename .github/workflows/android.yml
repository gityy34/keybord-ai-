name: Android debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, lint, and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Checksum APK
        run: cd app/build/outputs/apk/debug && sha256sum app-universal-debug.apk > app-universal-debug.apk.sha256
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: raabta-keyboard-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/debug/app-universal-debug.apk.sha256
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
